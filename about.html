<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกี่ยวกับฉัน | อัครินทร์ เสารยะวิเศษ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --clr-bg: #f8fafc;
            --clr-primary: #4f46e5;
            --clr-purple: #7c3aed;
            --clr-text: #0f172a;
            --clr-muted: #475569;
            --radius-full: 9999px;
            --radius-card: 24px;
            --radius-inner: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--clr-bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(167, 139, 250, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--clr-text);
            min-height: 100vh;
            padding: 90px 20px 40px;
            display: flex;
            justify-content: center;
        }

        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            padding: 6px 10px;
            border-radius: var(--radius-full);
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            z-index: 1000;
        }

        .nav-link {
            text-decoration: none;
            color: var(--clr-muted);
            font-size: 13px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: var(--radius-full);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-link:hover, 
        .nav-link.active {
            background: linear-gradient(135deg, var(--clr-primary), var(--clr-purple));
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
        }

        .container {
            max-width: 580px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid #ffffff;
            border-radius: var(--radius-card);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            padding: 32px 28px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 12px;
        }

        .badge {
            background: linear-gradient(135deg, var(--clr-primary), var(--clr-purple));
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .info-box {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            padding: 16px 20px;
            border-radius: var(--radius-inner);
            text-align: left;
        }

        .info-label {
            font-size: 12px;
            color: var(--clr-muted);
            display: block;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--clr-text);
        }

        @media (max-width: 580px) {
            body { padding-top: 85px; }
            .navbar { width: 95%; overflow-x: auto; justify-content: flex-start; }
            .nav-link { padding: 6px 10px; font-size: 11.5px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-link">คำนำ</a>
        <a href="home.html" class="nav-link">หน้าหลัก</a>
        <a href="about.html" class="nav-link active">เกี่ยวกับฉัน</a>
        <a href="target.html" class="nav-link">เป้าหมาย</a>
        <a href="portfolio.html" class="nav-link">ผลงาน</a>
    </nav>

    <main class="container">
        <section class="card">
            <h1 class="section-title">
                <span class="badge">PROFILE</span> 👤 ประวัติส่วนตัวและการศึกษา
            </h1>
            <div class="info-grid">
                <div class="info-box">
                    <span class="info-label">👤 ชื่อ - นามสกุล</span>
                    <span class="info-value">นายอัครินทร์ เสารยะวิเศษ (Akarin Saorayawiset)</span>
                </div>
                <div class="info-box">
                    <span class="info-label">🏫 สถานศึกษา</span>
                    <span class="info-value">โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</span>
                </div>
                <div class="info-box">
                    <span class="info-label">🎓 ระดับชั้นการศึกษา</span>
                    <span class="info-value">มัธยมศึกษาปีที่ 6</span>
                </div>
                <div class="info-box">
                    <span class="info-label">📚 แผนการเรียน</span>
                    <span class="info-value">วิทยาศาสตร์ - คณิตศาสตร์</span>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
