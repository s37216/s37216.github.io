<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแนะนำตัว | อัครินทร์ เสารยะวิเศษ</title>
    <!-- โหลด Google Font: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #e6e6fa 0%, #d8bfd8 100%);
            color: #333;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.14);
        }

        /* ปรับรูปเป็นสี่เหลี่ยมทรงรูปถ่ายติดบัตร (อัตราส่วน 3:4) ขนาดใหญ่ขึ้น */
        .profile-wrapper {
            position: relative;
            width: 180px;
            height: 230px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 16px; /* ขอบมนเล็กน้อยให้ดูทันสมัย */
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.02);
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .english-name {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-weight: 400;
        }

        /* กล่องแสดงข้อมูลนักเรียน */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0 25px;
        }

        .info-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px 15px;
            border-radius: 16px;
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #6c757d;
            display: block;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
        }

        .highlight-box {
            background: linear-gradient(135deg, #eef2f7 0%, #e0e7ff 100%);
            border: 1px solid #c7d2fe;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .highlight-box p {
            font-size: 15px;
            color: #3730a3;
            line-height: 1.6;
        }

        /* ปุ่มกดเพิ่มลูกเล่น (Shine Effect + Hover Interactive) */
        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #ffffff;
            padding: 14px 38px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float 2.5s ease-in-out infinite;
            overflow: hidden;
        }

        /* เอฟเฟกต์แสงสะท้อนวิ่งผ่านปุ่ม (Shine Effect) */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        /* เอฟเฟกต์ลูกศรขยับเมื่อเอาเมาส์ชี้ */
        .btn span.arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            box-shadow: 0 10px 25px rgba(44, 62, 80, 0.45);
            transform: translateY(-3px) scale(1.03);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover span.arrow {
            transform: translateX(5px);
        }

        .btn:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 4px 10px rgba(44, 62, 80, 0.3);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- กรอบรูปสี่เหลี่ยมทรงแนวตั้งสำหรับรูป 1-1.5 นิ้ว -->
        <div class="profile-wrapper">
            <img src="student.jpg" alt="รูปโปรไฟล์ นายอัครินทร์" class="profile-img">
        </div>

        <h1>อัครินทร์ เสารยะวิเศษ</h1>
        <p class="english-name">Akarin Saorayawiset</p>

        <!-- ส่วนข้อมูลการศึกษา -->
        <div class="info-grid">
            <div class="info-box">
                <span class="info-label">🏫 ระดับชั้น</span>
                <span class="info-value">มัธยมศึกษาปีที่ 6</span>
            </div>
            <div class="info-box">
                <span class="info-label">📚 แผนการเรียน</span>
                <span class="info-value">วิทย์ - คณิต</span>
            </div>
        </div>

        <!-- ส่วนความสนใจหลัก -->
        <div class="highlight-box">
            <p>⚙️ <strong>สาขาที่สนใจ :</strong> วิศวกรรมอุตสาหการ (Industrial Engineering - IE)</p>
            <p style="font-size: 13px; color: #4b5563; margin-top: 4px;">มุ่งมั่นพัฒนาทักษะการจัดการระบบ และ การเพิ่มประสิทธิภาพกระบวนการ</p>
        </div>

        <a href="portfolio.html" class="btn">
            ดูแฟ้มสะสมผลงาน (Portfolio)
            <span class="arrow">➔</span>
        </a>
    </div>

</body>
</html>
