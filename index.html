<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก | อัครินทร์ เสารยะวิเศษ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --clr-bg: #f5f3ff;
            --clr-primary: #4f46e5;
            --clr-purple: #7c3aed;
            --clr-text: #0f172a;
            --clr-muted: #475569;
            --clr-border: #c7d2fe;
            --radius-full: 9999px;
            --radius-card: 28px;
            --radius-inner: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--clr-bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(167, 139, 250, 0.2) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--clr-text);
            min-height: 100vh;
            padding: 90px 20px 40px;
            display: flex;
            justify-content: center;
        }

        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            padding: 6px 10px;
            border-radius: var(--radius-full);
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            z-index: 1000;
        }

        .nav-link {
            text-decoration: none;
            color: var(--clr-muted);
            font-size: 13px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, var(--clr-primary), var(--clr-purple));
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
        }

        .container { max-width: 580px; width: 100%; }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 2px solid var(--clr-border);
            border-radius: var(--radius-card);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.1);
            padding: 36px 28px;
            text-align: center;
        }

        .profile-wrapper {
            width: 130px;
            height: 160px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 12px 28px rgba(79, 70, 229, 0.18);
        }

        h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }

        .english-name {
            font-size: 14px;
            color: var(--clr-purple);
            font-weight: 600;
            background: #f5f3ff;
            border: 1px solid rgba(167, 139, 250, 0.4);
            display: inline-block;
            padding: 4px 18px;
            border-radius: var(--radius-full);
        }

        .tagline { margin: 16px 0 24px; font-size: 14px; color: var(--clr-muted); line-height: 1.6; }

        .quick-links { display: flex; flex-direction: column; gap: 10px; }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1.5px solid var(--clr-border);
            padding: 14px 18px;
            border-radius: var(--radius-inner);
            text-decoration: none;
            color: var(--clr-text);
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            border-color: var(--clr-purple);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.12);
            color: var(--clr-purple);
        }

        @media (max-width: 580px) {
            body { padding-top: 85px; }
            .navbar { width: 95%; overflow-x: auto; justify-content: flex-start; }
            .nav-link { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-link active">หน้าหลัก</a>
        <a href="about.html" class="nav-link">เกี่ยวกับฉัน</a>
        <a href="target.html" class="nav-link">เป้าหมาย</a>
        <a href="portfolio.html" class="nav-link">ผลงาน</a>
    </nav>

    <main class="container">
        <section class="card">
            <div class="profile-wrapper">
                <img src="S__49872901.jpg" alt="ภาพโปรไฟล์ อัครินทร์ เสารยะวิเศษ" class="profile-img">
            </div>

            <h1>อัครินทร์ เสารยะวิเศษ</h1>
            <span class="english-name">Akarin Saorayawiset</span>
            <p class="tagline">ยินดีต้อนรับสู่เว็บไซต์แฟ้มสะสมผลงาน | มุ่งมั่นพัฒนาตนเองสู่การเป็นวิศวกรอุตสาหการยุคใหม่</p>

            <div class="quick-links">
                <a href="about.html" class="menu-btn">
                    <span>👤 1. เกี่ยวกับฉัน (About Me)</span>
                    <span>➔</span>
                </a>
                <a href="target.html" class="menu-btn">
                    <span>💡 2. เป้าหมาย (Goals)</span>
                    <span>➔</span>
                </a>
                <a href="portfolio.html" class="menu-btn">
                    <span>📁 3. ผลงาน (Portfolio)</span>
                    <span>➔</span>
                </a>
            </div>
        </section>
    </main>

</body>
</html>
